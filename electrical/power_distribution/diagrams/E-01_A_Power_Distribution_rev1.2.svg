<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="r" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#c62828"/></marker>
<marker id="g" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2e7d32"/></marker>
<marker id="b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1565c0"/></marker>
</defs>
<style>
.t{font-size:19px;fill:#222}.s{font-size:15px;fill:#444}.h{font-size:24px;font-weight:bold;fill:#111}
.bx{fill:#fff;stroke:#333;stroke-width:2}.fu{fill:#fff8e1;stroke:#ef6c00;stroke-width:2}
.k{fill:#e3f2fd;stroke:#1565c0;stroke-width:2.5}.on{fill:#f1f8e9;stroke:#558b2f;stroke-width:2}.act{fill:#ffebee;stroke:#c62828;stroke-width:2}
.pw{stroke:#c62828;stroke-width:8;fill:none}.gw{stroke:#2e7d32;stroke-width:4;fill:none}.bw{stroke:#1565c0;stroke-width:3;fill:none}
.dash{stroke-dasharray:10 7}
</style>
<rect width="2200" height="1400" fill="#fff"/>
<text x="40" y="46" style="font-size:30px;font-weight:bold" fill="#111">E-01 A · Power distribution, OpenAMRobot 2.0 (rev1.2, 15 Oct 2026)</text>
<text x="40" y="78" class="s">Single-line diagram, 24 V (25.6 V nominal, 29.2 V max). Fuse at the source end of every cable. BOM IDs in brackets. Values per B-02 fuse schedule.</text>

<!-- zones -->
<rect x="900" y="110" width="1270" height="560" rx="14" fill="#f9fbe7" stroke="#9ccc65" stroke-width="2" class="dash"/>
<text x="920" y="140" style="font-size:20px;font-weight:bold" fill="#33691e">ALWAYS ON: never cut by an E-stop (UC1-70)</text>
<rect x="900" y="700" width="1270" height="560" rx="14" fill="#fff5f5" stroke="#ef9a9a" stroke-width="2" class="dash"/>
<text x="920" y="730" style="font-size:20px;font-weight:bold" fill="#b71c1c">SAFE BUS: cut by K1 and K2 on any E-stop</text>

<!-- battery chain -->
<rect x="40" y="160" width="230" height="130" rx="10" class="bx"/>
<text x="155" y="195" class="t" text-anchor="middle" font-weight="bold">Battery</text>
<text x="155" y="222" class="s" text-anchor="middle">8S LiFePO4 EVE LF105</text>
<text x="155" y="244" class="s" text-anchor="middle">25.6 V, 105 Ah (PWR-001)</text>
<text x="155" y="270" class="s" text-anchor="middle">Daly BMS 150 A (PWR-002)</text>
<text x="155" y="318" class="s" text-anchor="middle" fill="#1565c0">CAN2 → STM32: faults, SOC</text>
<line x1="270" y1="225" x2="320" y2="225" class="pw"/>
<rect x="320" y="190" width="120" height="70" rx="8" class="bx"/><text x="380" y="220" class="s" text-anchor="middle">J-BAT</text><text x="380" y="242" class="s" text-anchor="middle">(PWR-018)</text>
<line x1="440" y1="225" x2="480" y2="225" class="pw"/>
<rect x="480" y="180" width="150" height="90" rx="8" class="fu"/><text x="555" y="212" class="t" text-anchor="middle" font-weight="bold">F0</text><text x="555" y="236" class="s" text-anchor="middle">110 A Class T</text><text x="555" y="256" class="s" text-anchor="middle">(PWR-003)</text>
<line x1="630" y1="225" x2="670" y2="225" class="pw"/>
<rect x="670" y="180" width="160" height="90" rx="8" class="bx"/><text x="750" y="212" class="t" text-anchor="middle" font-weight="bold">QS1</text><text x="750" y="236" class="s" text-anchor="middle">lockable disconnect</text><text x="750" y="256" class="s" text-anchor="middle">(PWR-004)</text>
<line x1="830" y1="225" x2="860" y2="225" class="pw"/>
<!-- BAT bus -->
<line x1="860" y1="190" x2="860" y2="800" stroke="#c62828" stroke-width="14"/>
<text x="800" y="330" class="t" text-anchor="end" font-weight="bold" fill="#c62828">BAT +</text>
<text x="800" y="352" class="s" text-anchor="end">bus (PWR-017)</text>
<text x="800" y="372" class="s" text-anchor="end">fuse block FB-A</text>

<!-- always on branches -->
<!-- charge -->
<line x1="860" y1="200" x2="960" y2="200" class="pw"/>
<rect x="960" y="170" width="150" height="60" rx="6" class="fu"/><text x="1035" y="197" class="t" text-anchor="middle">F-CHG</text><text x="1035" y="219" class="s" text-anchor="middle">30 A MIDI</text>
<line x1="1110" y1="200" x2="1180" y2="200" class="pw" marker-end="url(#r)"/>
<rect x="1190" y="165" width="420" height="70" rx="8" class="on"/><text x="1400" y="193" class="t" text-anchor="middle">SB50 charge connector</text><text x="1400" y="217" class="s" text-anchor="middle">bench: Daly 28.4 V / 20 A here, E-stop pressed</text>
<line x1="1610" y1="200" x2="1660" y2="200" class="pw"/>
<rect x="1660" y="165" width="490" height="70" rx="8" class="on"/><text x="1905" y="193" class="t" text-anchor="middle">TZBOT WCM-500-24 receiver</text><text x="1905" y="217" class="s" text-anchor="middle">28.4 V, 15 A · start/fault lines → diagram B</text>
<!-- J401 -->
<line x1="860" y1="320" x2="960" y2="320" class="pw"/>
<rect x="960" y="290" width="150" height="60" rx="6" class="fu"/><text x="1035" y="317" class="t" text-anchor="middle">F-J401</text><text x="1035" y="339" class="s" text-anchor="middle">10 A ATO</text>
<line x1="1110" y1="320" x2="1190" y2="320" class="pw"/>
<rect x="1190" y="290" width="230" height="60" rx="6" class="bx"/><text x="1305" y="317" class="s" text-anchor="middle">inrush / TVS</text><text x="1305" y="337" class="s" text-anchor="middle">(PWR-009, PWR-029)</text>
<line x1="1420" y1="320" x2="1480" y2="320" class="pw" marker-end="url(#r)"/>
<rect x="1490" y="285" width="660" height="70" rx="8" class="on"/><text x="1820" y="315" class="t" text-anchor="middle">Jetson Orin NX on Robotics J401 (CMP-002)</text><text x="1820" y="338" class="s" text-anchor="middle">19 to 54 V input · 2.5 mm² (CBL-012)</text>
<!-- 5V -->
<line x1="860" y1="440" x2="960" y2="440" class="pw"/>
<rect x="960" y="410" width="150" height="60" rx="6" class="fu"/><text x="1035" y="437" class="t" text-anchor="middle">F-5V</text><text x="1035" y="459" class="s" text-anchor="middle">5 A ATO</text>
<line x1="1110" y1="440" x2="1190" y2="440" class="pw"/>
<rect x="1190" y="405" width="230" height="70" rx="6" class="bx"/><text x="1305" y="434" class="t" text-anchor="middle">RSD-60G-5</text><text x="1305" y="457" class="s" text-anchor="middle">24 → 5 V (PWR-007)</text>
<line x1="1420" y1="440" x2="1480" y2="440" class="gw" marker-end="url(#g)"/>
<rect x="1490" y="405" width="660" height="70" rx="8" class="on"/><text x="1820" y="434" class="t" text-anchor="middle">5 V rail: STM32 NUCLEO-H723ZG · RPLIDAR S3 · ToF / ultrasonic · IMU</text><text x="1820" y="457" class="s" text-anchor="middle">no 12 V rail (P-03)</text>
<!-- 24V -->
<line x1="860" y1="560" x2="960" y2="560" class="pw"/>
<rect x="960" y="530" width="150" height="60" rx="6" class="fu"/><text x="1035" y="557" class="t" text-anchor="middle">F-24V</text><text x="1035" y="579" class="s" text-anchor="middle">7.5 A ATO</text>
<line x1="1110" y1="560" x2="1190" y2="560" class="pw"/>
<rect x="1190" y="525" width="230" height="70" rx="6" class="bx"/><text x="1305" y="554" class="t" text-anchor="middle">RSD-100B-24</text><text x="1305" y="577" class="s" text-anchor="middle">regulated 24 V (PWR-012)</text>
<line x1="1420" y1="560" x2="1480" y2="560" class="bw" marker-end="url(#b)"/>
<rect x="1490" y="500" width="660" height="150" rx="8" class="on"/>
<text x="1510" y="528" class="t" font-weight="bold">24 V rail fuse block FB-C (Blue Sea 5046)</text>
<text x="1510" y="556" class="s">F-SAFE 2 A → PNOZ s3, K1 and K2 coils, RESET lamp, charge relay (diagram B)</text>
<text x="1510" y="580" class="s">F-PD 3 A → tablet USB-PD (PWR-008)</text>
<text x="1510" y="604" class="s">F-HUB 3 A → USB hub (CMP-009) · F-FAN 2 A → fan (CMP-006)</text>
<text x="1510" y="628" class="s">spares</text>

<!-- SAFE bus -->
<line x1="860" y1="790" x2="960" y2="790" class="pw"/>
<rect x="960" y="740" width="180" height="100" rx="10" class="k"/><text x="1050" y="777" class="t" text-anchor="middle" font-weight="bold">K1</text><text x="1050" y="801" class="s" text-anchor="middle">LEV100H, NO</text><text x="1050" y="822" class="s" text-anchor="middle">(SAF-003)</text>
<line x1="1140" y1="790" x2="1200" y2="790" class="pw"/>
<rect x="1200" y="740" width="180" height="100" rx="10" class="k"/><text x="1290" y="777" class="t" text-anchor="middle" font-weight="bold">K2</text><text x="1290" y="801" class="s" text-anchor="middle">LEV100H, NO</text><text x="1290" y="822" class="s" text-anchor="middle">(SAF-003)</text>
<path d="M1180,790 L1180,880 L1400,880 L1400,790" class="bw dash"/>
<rect x="1215" y="862" width="150" height="36" rx="5" fill="#fff" stroke="#1565c0" class="dash"/><text x="1290" y="886" class="s" text-anchor="middle">Kpre + R + 1 A</text>
<text x="1290" y="920" class="s" text-anchor="middle">precharge, conditional (SAF-004)</text>
<line x1="1380" y1="790" x2="1440" y2="790" class="pw"/>
<line x1="1440" y1="760" x2="1440" y2="1220" stroke="#c62828" stroke-width="14"/>
<text x="1440" y="1250" class="t" text-anchor="middle" font-weight="bold" fill="#c62828">SAFE +</text>
<text x="1440" y="1272" class="s" text-anchor="middle">fuse block FB-B</text>
<text x="1170" y="960" class="s" text-anchor="middle">coils driven by PNOZ s3</text>
<text x="1170" y="980" class="s" text-anchor="middle">safety outputs (diagram B)</text>
<text x="1170" y="1000" class="s" text-anchor="middle">25 mm² (CBL-004)</text>

<!-- actuator branches -->
<line x1="1440" y1="800" x2="1500" y2="800" class="pw"/>
<rect x="1500" y="770" width="150" height="60" rx="6" class="fu"/><text x="1575" y="797" class="t" text-anchor="middle">F-TRAC</text><text x="1575" y="819" class="s" text-anchor="middle">40 A MIDI</text>
<line x1="1650" y1="800" x2="1700" y2="800" class="pw" marker-end="url(#r)"/>
<rect x="1710" y="765" width="440" height="70" rx="8" class="act"/><text x="1930" y="794" class="t" text-anchor="middle">ZLAC8015D + 2 hub motors, brakes</text><text x="1930" y="817" class="s" text-anchor="middle">(DRV-001, DRV-002) · 10 mm² (CBL-005)</text>
<line x1="1440" y1="920" x2="1500" y2="920" class="pw"/>
<rect x="1500" y="890" width="150" height="60" rx="6" class="fu"/><text x="1575" y="917" class="t" text-anchor="middle">F-ARM-L</text><text x="1575" y="939" class="s" text-anchor="middle">30 A MIDI</text>
<line x1="1650" y1="920" x2="1700" y2="920" class="pw" marker-end="url(#r)"/>
<rect x="1710" y="885" width="440" height="70" rx="8" class="act"/><text x="1930" y="914" class="t" text-anchor="middle">OpenArm 2.0 left arm (ARM-001)</text><text x="1930" y="937" class="s" text-anchor="middle">6 mm² (CBL-006) · gate ARM-VOLT</text>
<line x1="1440" y1="1040" x2="1500" y2="1040" class="pw"/>
<rect x="1500" y="1010" width="150" height="60" rx="6" class="fu"/><text x="1575" y="1037" class="t" text-anchor="middle">F-ARM-R</text><text x="1575" y="1059" class="s" text-anchor="middle">30 A MIDI</text>
<line x1="1650" y1="1040" x2="1700" y2="1040" class="pw" marker-end="url(#r)"/>
<rect x="1710" y="1005" width="440" height="70" rx="8" class="act"/><text x="1930" y="1034" class="t" text-anchor="middle">OpenArm 2.0 right arm (ARM-001)</text><text x="1930" y="1057" class="s" text-anchor="middle">6 mm² (CBL-006)</text>
<line x1="1440" y1="1160" x2="1500" y2="1160" class="pw"/>
<rect x="1500" y="1130" width="150" height="60" rx="6" class="fu"/><text x="1575" y="1157" class="t" text-anchor="middle">F-LIFT</text><text x="1575" y="1179" class="s" text-anchor="middle">10 A ATO</text>
<line x1="1650" y1="1160" x2="1700" y2="1160" class="pw" marker-end="url(#r)"/>
<rect x="1710" y="1125" width="440" height="70" rx="8" class="act"/><text x="1930" y="1154" class="t" text-anchor="middle">Lift H-bridge (CTL-017) → DOLD Hexalift V4</text><text x="1930" y="1177" class="s" text-anchor="middle">24 V, max 7 A · PWR-030 auxiliary branch</text>

<!-- notes -->
<rect x="40" y="400" width="760" height="880" rx="12" fill="#fafafa" stroke="#999"/>
<text x="60" y="418" class="h">Rules</text>
<text x="60" y="455" class="t">1. No circuit breaker. F0 (Class T, 20 kA interrupt) protects</text>
<text x="85" y="480" class="t">the battery cable; QS1 isolates and locks OFF.</text>
<text x="60" y="515" class="t">2. One fuse per branch, sized to its cable, at the source end.</text>
<text x="60" y="550" class="t">3. Electronics (J401, 5 V, 24 V rail) take power from the BAT</text>
<text x="85" y="575" class="t">bus: they stay on during every E-stop.</text>
<text x="60" y="610" class="t">4. Every actuator (traction, arms, lift) takes power only</text>
<text x="85" y="635" class="t">from the SAFE bus behind K1 and K2 in series.</text>
<text x="60" y="670" class="t">5. Charging enters on the BAT bus; a plugged or charging</text>
<text x="85" y="695" class="t">robot cannot enable K1/K2 (diagram B).</text>
<text x="60" y="730" class="t">6. Returns to the BAT − bus. No chassis return.</text>
<text x="85" y="755" class="t">The BMS switches the pack negative (P−).</text>
<text x="60" y="790" class="t">7. No 12 V rail. Auxiliary rails are 5 V and 24 V.</text>
<text x="60" y="840" class="h">Cables (B-02 / BOM 7.7)</text>
<text x="60" y="875" class="t">Main and K1/K2: 25 mm² · traction: 10 mm²</text>
<text x="60" y="905" class="t">Arms, charge: 6 mm² · J401: 2.5 mm²</text>
<text x="60" y="935" class="t">Converter inputs: 1.5 mm² · 5 V sensors: 0.5 mm²</text>
<text x="60" y="965" class="t">Safety 24 V: 0.75 mm² · E-stop cable: 4 × 0.5 mm²</text>
<text x="60" y="1015" class="h">Load envelope (B-02)</text>
<text x="60" y="1050" class="t">60 A continuous, 80 A for 10 s; budget about 350 W.</text>
<text x="60" y="1080" class="t">Contactors 100 A; F0 110 A.</text>
<text x="60" y="1130" class="h">Conestoga v0.0.1 build</text>
<text x="60" y="1165" class="t">Same chain. SAFE bus feeds only the two ZBLD.C20</text>
<text x="60" y="1190" class="t">drivers (F-TRAC 20 A). No arms, no lift.</text>
<text x="60" y="1215" class="t">Controller: Teensy 4.0 on the 5 V rail.</text>
</svg>
