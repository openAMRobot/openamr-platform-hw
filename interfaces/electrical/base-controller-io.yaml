# OpenAMRobot 2.0 base-controller I/O contract (machine-readable).
#
# Read by tools/ci/check_electrical_contract.py (this repository) and by
# check_ioc_contract.py in openamr-platform-fw, which compares a CubeMX .ioc with it.
# Schema: base-controller-io.schema.json. Change it only through a contract change
# request (AGENTS.md, Contracts); bump contract_version with every change.
#
# Status of an entry:
#   verified      checked against the board schematic or datasheet by the hardware owner
#   proposed      from the pin map draft, not yet verified
#   unchecked     pin proposed; alternate function not yet checked by the owner
#   tbd           not allocated yet (gpio null)
#   not_required  a pin the peripheral would use but the design does not need; no AF
#   reserved      used by the NUCLEO-H723ZG board itself; no other signal may use it
#
# A passing check proves this file is self-consistent and agrees with the register
# text. It does not prove that the electronics behave as designed.

contract_version: 0.1.0
controller: STM32H723ZG
package: LQFP144
board: NUCLEO-H723ZG
board_id: MB1364
board_revision: E-01
source_document: OpenAMRobot NUCLEO-H723ZG Controller Pin Map
source_revision: draft of 18 October 2026, status PROPOSAL
owner: Evans Kwashie (electrical-owner, @evans-kwashie)
hardware_owner: Cuma
register:
  repository: openAMRobot/.github
  file: decisions.yaml
  decisions: [BASE-CONTROLLER-IO, BASE-CONTROLLER-GATES, SAFETY-CHAIN-IO]

sources:
  pin-map: OpenAMRobot NUCLEO-H723ZG Controller Pin Map, draft 18 October 2026 (PROPOSAL), not held in any repository
  schematic: MB1364 NUCLEO-H723ZG schematic E-01, datasheets/STMicroelectronics/STM32H723ZG/mb1364-h723zg-e01_schematic.pdf
  ds13313: STM32H723xE/G datasheet DS13313 Rev 5, Table 8 (pin alternate functions), datasheets/STMicroelectronics/STM32H723ZG/stm32h723zg.pdf
  um2407: STM32H7 Nucleo-144 user manual UM2407 Rev 6, Tables 18 to 21 (ZIO connectors), datasheets/STMicroelectronics/STM32H723ZG/um2407-stm32h7-nucleo144-board-stmicroelectronics.pdf
  register: openAMRobot/.github decisions.yaml BASE-CONTROLLER-IO and SAFETY-CHAIN-IO

signals:
  # MaxBotix MB7060 x4: UART 9600 8N1, receive only, RX inverted, sensor at 3.3 V.
  - signal: us_front_left_rx
    device: MB7060
    direction: input
    peripheral: UART4
    function: UART4_RX
    gpio: PB8
    af: 8
    zio: CN7-2 (D15)
    settings: {baud: 9600, frame: 8N1, rx_invert: true, mode: rx_only, supply_v: 3.3}
    status: proposed
    source: [pin-map, ds13313, um2407]
  - signal: us_front_left_tx
    device: MB7060
    direction: output
    peripheral: UART4
    function: UART4_TX
    gpio: PA0
    af: null
    zio: CN10-29 (D32)
    settings: {}
    status: not_required
    source: [pin-map]
  - signal: us_front_left_trigger
    device: MB7060
    direction: output
    peripheral: GPIO
    function: GPIO_Output
    gpio: PE2
    af: null
    zio: CN9-14 (D56) and CN10-25 (D31)
    settings: {role: sequential ranging trigger}
    status: proposed
    source: [pin-map, um2407]
  - signal: us_front_right_rx
