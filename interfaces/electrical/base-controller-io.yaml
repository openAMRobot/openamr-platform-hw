  # CAN: FDCAN1 traction, FDCAN2 BMS (Daly), FDCAN3 upper-body auxiliary.
  # AF numbers below are read from DS13313 Rev 5 Table 8; the owner has not checked them
  # yet, so the entries stay "unchecked" until the owner moves them to proposed.
  - signal: can1_rx
    device: ZLAC8015D traction bus
    direction: input
    peripheral: FDCAN1
    function: FDCAN1_RX
    gpio: PD0
    af: 9
    zio: CN9-25 (D67)
    settings: {bus: CAN1, role: traction, bitrate: 500000}
    status: unchecked
    source: [pin-map, ds13313, um2407]
  - signal: can1_tx
    device: ZLAC8015D traction bus
    direction: output
    peripheral: FDCAN1
    function: FDCAN1_TX
    gpio: PD1
    af: 9
    zio: CN9-27 (D66)
    settings: {bus: CAN1, role: traction, bitrate: 500000}
    status: unchecked
    source: [pin-map, ds13313, um2407]
  - signal: can2_rx
    device: Daly BMS
    direction: input
    peripheral: FDCAN2
    function: FDCAN2_RX
    gpio: PB12
    af: 9
    zio: CN7-7 (D19)
    settings: {bus: CAN2, role: bms, bitrate: 250000}
    status: unchecked
    source: [pin-map, ds13313, um2407]
  - signal: can2_tx
    device: Daly BMS
    direction: output
    peripheral: FDCAN2
    function: FDCAN2_TX
    gpio: PB6
    af: 9
    zio: CN10-14 (D1)
    settings: {bus: CAN2, role: bms, bitrate: 250000}
    status: unchecked
    source: [pin-map, ds13313, um2407]
  - signal: can3_rx
    device: upper-body auxiliary actuators
    direction: input
    peripheral: FDCAN3
    function: FDCAN3_RX
    gpio: PD12
    af: 5
    zio: CN10-21 (D29)
    settings: {bus: CAN3, role: upper_body_auxiliary, bitrate: 500000}
    status: unchecked
    source: [pin-map, ds13313, um2407]
  - signal: can3_tx
    device: upper-body auxiliary actuators
    direction: output
    peripheral: FDCAN3
    function: FDCAN3_TX
    gpio: PD13
    af: 5
    zio: CN10-19 (D28)
    settings: {bus: CAN3, role: upper_body_auxiliary, bitrate: 500000}
    status: unchecked
    source: [pin-map, ds13313, um2407]

