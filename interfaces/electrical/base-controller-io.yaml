    direction: output
    peripheral: UART5
    function: UART5_TX
    gpio: PC12
    af: null
    zio: CN8-10 (D47)
    settings: {}
    status: not_required
    source: [pin-map]
  - signal: us_front_right_trigger
    device: MB7060
    direction: output
    peripheral: GPIO
    function: GPIO_Output
    gpio: PE3
    af: null
    zio: CN9-22 (D60)
    settings: {role: sequential ranging trigger}
