# SPDX-License-Identifier: CC-BY-4.0
# OpenAMRobot 2.0 finish schedule, mobile base. Machine-readable source for the robot model.
# The companion file openAMRobot/openamr-upperbody-hw docs/finish/finishes.yaml uses the same
# schema, palette and id rules; entry ids are unique across both files (prefix base. or upper.).
# finish-schedule.md is generated from this file by tools/finish_tables.py; edit this file first.
# Cosmetic only: nothing here changes a shape, dimension, position, function or material.

schema: openamrobot-finishes/1
scope: mobile base
repository: openAMRobot/openamr-platform-hw
companion: openAMRobot/openamr-upperbody-hw docs/finish/finishes.yaml
date: 2026-10-25

model:
  repository: openAMRobot/openamr-platform-sw
  commit: 9a58e0bc90ed10940947c700dce0b7bee0244764
  node_ids_from: ros2/src/openamrobot_description/meshes/PROVENANCE.yaml (glb.nodes, 44 nodes)
  glb: build/base_visual.glb (not committed; regenerated for the preview renders)
  glb_sha256: fb41c555b1e429804e2794355a08d61bce8315ed0454b4957e3f435d0796b7b0

# How a reader applies an entry:
#   node_id         GLB node id (glTF node name and extras.id). null: no node is planned.
#   node_id_status  existing (in the GLB today; the default when absent) or proposed (reserved id).
#   model_link(s)   optional URDF link name(s) the entry colours when there is no GLB node.
#   colour          palette key, or null for as_delivered parts that keep the model's own materials.
#   srgb_hex        display value for the model; null means keep the node's existing materials.
#   finish          one of finish_values. as_delivered: purchased part, no finishing operation.
#   status          decided: material, colour and process are established by the cited sources.
#                   verify: at least one input is open; the verify field names the check.
finish_values: [matte, satin, gloss, anodised, printed, as_delivered]
status_values: [decided, verify]

# sRGB values are screen approximations of the RAL references. A physical RAL sample governs.
palette:
  light_grey_7035: {ral: RAL 7035, name: Light grey, srgb_hex: "#CBD0CC"}
  graphite_7016: {ral: RAL 7016, name: Anthracite grey, srgb_hex: "#383E42"}
  black_9005: {ral: RAL 9005, name: Jet black, srgb_hex: "#0A0A0A"}
  orange_2004: {ral: RAL 2004, name: Pure orange, srgb_hex: "#F44611"}
  cyan_5018: {ral: RAL 5018, name: Turquoise blue (cyan reference; verify against a physical sample), srgb_hex: "#3F888F"}
  white_9016: {ral: RAL 9016, name: Traffic white (finish on the current MMP drawings), srgb_hex: "#F6F6F6"}

