     material: steel_EN_1.0114, material_source: "drawing MMP.00.00.00.001: Sheet 2.0 Steel EN 1.0114", drawing_mm: [385, 165, 20],
     ledger: [front_panel], leaf: "^MMP\\.00\\.00\\.00\\.001 "}
  - {part: MMP.00.00.00.002, name: Back panel, file: "MMP.00.00.00.002 Back panel.STEP", status: on_2_0, qty: 1, bom: MEC-001,
