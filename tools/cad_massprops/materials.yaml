  - {part: MMP.02.00.00.000, name: Base assembly, file: "MMP.02.00.00.000 Base assembly.STEP"}
  - {part: MMP.03.00.00.000, name: Wheel assembly (legacy 1.x drive), file: "MMP.03.00.00.000 Wheel assembly.STEP"}
  - {part: MMP.04.00.00.000, name: Center bracket assembly, file: "MMP.04.00.00.000 Center bracket assembly.STEP"}
  - {part: MMP.05.00.00.000, name: Support assembly, file: "MMP.05.00.00.000 Support assembly.STEP"}
  - {part: MMP.05.00.00.000-01, name: Support assembly (mirrored), file: "MMP.05.00.00.000-01 Support assembly.STEP"}
  - {part: MMP.07.00.00.000, name: Lidar support assembly, file: "MMP.07.00.00.000 Lidar support assembly.STEP"}

# Purchased parts: datasheet or BOM mass. A STEP, where given, is used for geometry and for an inertia estimate only
# (uniform density scaled to the datasheet mass).
purchased:
  - id: DRV-001
    name: ZLTECH ZLLG80ASM250-L-B2 V1.01 double-shaft hub motor with brake
    file: "datasheets/ZLTech/wheel_ZLLG80ASM250/ZLLG80ASM250-L-B2 V1.01 double-shaft.STEP"
    qty: 2
    links: [left_wheel_link, right_wheel_link]
    mass_kg: 3.60
    mass_source: "ZLLG80ASM250-L V1.0 double-shaft drawing (datasheets/ZLTech/wheel_ZLLG80ASM250/ZLLG80ASM250-L V1.0.zip): weight 3.60 kg +/- 5 %. The selected B2 V1.01 drawing leaves the weight field empty; the V3.0 single-shaft drawing gives 3.55 kg +/- 5 %."
    estimate: true
    note: "the B2 V1.01 weight is not documented; weigh one delivered motor"
    spin_axis_in_step: x
  - {id: MEC-002, name: Blickle LPA-VSTH 35K castor, qty: 4, mass_kg: 0.300, mass_source: "mass_ledger.yaml: Blickle LPA-VSTH 35K data sheet, unit weight 0.3 kg (data sheet not in this repository)", estimate: false}
  - {id: NAV-001, name: Slamtec RPLIDAR S3, qty: 1, mass_kg: 0.115, mass_source: "mass_ledger.yaml: Slamtec RPLIDAR S3 datasheet, 115 g (data sheet not in this repository)", estimate: false}
  - {id: CAM-001, name: Orbbec Gemini 336L, qty: 1, mass_kg: 0.135, mass_source: "mass_ledger.yaml: Orbbec Gemini 336L specification, 135 g (data sheet not in this repository)", estimate: false}
  - {id: DRV-002, name: ZLTECH ZLAC8015D V4.2 driver, qty: 1, mass_kg: 0.600, mass_source: "mass_ledger.yaml: estimate from the manual outline (no datasheet mass)", estimate: true}

assembly:
  file: "mechanical/cad/Full_assembly_STEP/MMP.00.00.00.000_full_assembly.STEP.zip"
  # Frame of the full assembly STEP, found from the geometry (see report.md): X forward (front panel at +X), Y up, Z to the right;
  # floor at Y = 0 (bottom of the 200 mm wheels at Y = -2 mm, the model's 2 mm tyre compression); legacy wheel axle at X = 0,
  # Y = 98 mm, wheel centres at Z = +/-199.75 mm.
  to_base_footprint:
    rotation: [[1, 0, 0], [0, 0, -1], [0, 1, 0]]   # p_bf = R p_cad + t (x = X, y = -Z, z = Y), a rotation of +90 deg about X
    translation_m: [0, 0, 0]
  base_link_z_m: 0.098   # openamrobot-docs facts.yaml base_link_z (B7, datums base_link_height_above_floor)
  placement_overrides:
    MMP.02.00.00.001:
      translation_m: [0.0, 0.052, 0.0]
      reason: "the full assembly places the base sheet at (+1.49, +43.22, -12.57) mm, 8.8 mm below and 12.6 mm beside its design position; MMP.02.00.00.000 Base assembly.STEP, the 52 mm deck underside datum (BOM Mechanical sheet) and the parts standing on the deck at Y = 54 mm place it at (0, 52, 0) mm"
  # the roll-up set: parts on base_link with a known material (others are listed with their volume only)
  rollup_status: [on_2_0]
