# Materials and part list for tools/cad_massprops/massprops.py.
#
# Rules (see README.md):
# - A material is assigned only when a document names it. The source of every assignment is given.
# - Where no document names the material, material is "unknown" and no mass is computed.
# - Purchased parts take the datasheet or BOM mass, never the CAD volume.
# - estimate: true marks values that are not from a document for this exact part.
#
# The STEP files exported from Autodesk (front panel, back panel, printed mounts, electronics bracket, driver mount,
# STM32 Click mount plate, LiDAR spacer) carry a material property "Celik" (steel) at 7850 kg/m3. It is the CAD default:
# it is also on parts that BOM Issue 7.15 names PETG. It is not used as a material source.

schema_version: 1

materials:
  steel_EN_1.0114:
    description: "Steel EN 1.0114 (S235JR, EN 10025-2), sheet"
    density_kg_m3: 7850
    density_source: "EN 1993-1-1 clause 3.2.6: unit mass of structural steel 7850 kg/m3"
    estimate: false
  steel_37Cr4:
    description: "Steel 37Cr4 (EN 1.7034), bar"
    density_kg_m3: 7850
    density_source: "nominal steel value of EN 1993-1-1 clause 3.2.6; no alloy-specific value in the repository"
    estimate: true
  PETG:
    description: "PETG, 3D printed"
    density_kg_m3: 1270
    density_source: "PETG copolyester resin density 1.27 g/cm3 (ISO 1183 value on PETG resin datasheets); same value as the roadmap model (openamrobot-docs design_intent/_common.py)"
    estimate: true
    note: "mass from the solid CAD volume, that is 100 % infill; infill and wall settings are not documented, so the printed part is lighter or equal"

# Drawing sources are the PDF drawings next to each STEP in mechanical/cad/production_files (title block material field).
# BOM = BOM Issue 7.15, Hardware BOM sheet. M-01 = M-01 Mechanical CAD Design Work Package rev19.10.
# status: on_2_0 (on the 2.0 base per the roadmap model and M-01), legacy (1.x drivetrain parts that M-02 replaces),
#         not_in_2_0 (not placed in the full assembly and not in the 2.0 model)
# ledger: roadmap model component(s) the part is compared with (openamrobot-docs base_glb.js node ids and mass_export.yaml items)
# leaf: regular expression on the leaf name in the full assembly STEP (placement for the assembly roll-up)
# drawing_mm: overall size read from the drawing, used to check the STEP length unit (sorted comparison)
parts:
