  - {part: MMP.00.00.00.003, name: Side panel, file: "MMP.00.00.00.003 Side panel.STEP", status: on_2_0, qty: 2, bom: MEC-001,
     material: steel_EN_1.0114, material_source: "drawing MMP.00.00.00.003: Sheet 0.8 Steel EN 1.0114", drawing_mm: [778.6, 163, 97.5],
     ledger: [side_panel_left, side_panel_right], leaf: "^MMP\\.00\\.00\\.00\\.003 "}
  - {part: MMP.00.00.00.004, name: Plastic cover, file: "MMP.00.00.00.004 Plastic cover.STEP", status: not_in_2_0, qty: 0,
